type: object # Корневой тип схемы координат
description: Координаты объекта на доске # Назначение схемы
additionalProperties: false # Запрещает дополнительные поля
required: # Обязательные координаты
- x # Горизонтальная координата обязательна
- y # Вертикальная координата обязательна
properties: # Поля координат
  x: # Горизонтальная координата
    type: number # Числовое значение
    description: Горизонтальная координата # Назначение поля
  y: # Вертикальная координата
    type: number # Числовое значение
    description: Вертикальная координата # Назначение поля
