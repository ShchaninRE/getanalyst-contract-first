type: object # Корневой тип payload события
description: Данные события об изменении доски # Назначение схемы
required: # Обязательные поля события
- eventId # Идентификатор события обязателен
- eventVersion # Версия события обязательна
- occurredAt # Время события обязательно
- correlationId # Correlation ID обязателен
- boardId # Идентификатор доски обязателен
- actorId # Идентификатор инициатора обязателен
- changeType # Тип изменения обязателен
- resourceType # Тип ресурса обязателен
- resourceId # Идентификатор ресурса обязателен
properties: # Поля payload
  eventId: # Идентификатор события
    type: string # Значение передаётся строкой
    description: Идентификатор события # Назначение поля
  eventVersion: # Версия формата события
    type: integer # Версия передаётся целым числом
    description: Версия формата события # Назначение поля
  occurredAt: # Время возникновения события
    type: string # Значение передаётся строкой
    format: date-time # Формат даты и времени
    description: Дата и время события в UTC # Назначение поля
  correlationId: # Идентификатор связанной операции
    type: string # Значение передаётся строкой
    description: Идентификатор связанной операции # Поле, на которое указывает message.correlationId.location
  boardId: # Идентификатор изменённой доски
    type: string # Значение передаётся строкой
    description: Идентификатор изменённой доски # Назначение поля
  actorId: # Идентификатор пользователя-инициатора
    type: string # Значение передаётся строкой
    description: Идентификатор пользователя # Назначение поля
  changeType: # Тип изменения на доске
    type: string # Значение выбирается из enum
    description: Тип изменения # Назначение поля
    enum: # Допустимые типы изменений
    - STICKY_NOTE_CREATED # Создан стикер
    - STICKY_NOTE_UPDATED # Изменён стикер
    - STICKY_NOTE_DELETED # Удалён стикер
    - COMMENT_CREATED # Создан комментарий
    - COMMENT_RESOLVED # Комментарий решён
  resourceType: # Тип изменённого ресурса
    type: string # Значение выбирается из enum
    description: Тип изменённого ресурса # Назначение поля
    enum: # Допустимые типы ресурсов
    - STICKY_NOTE # Стикер
    - COMMENT # Комментарий
  resourceId: # Идентификатор изменённого ресурса
    type: string # Значение передаётся строкой
    description: Идентификатор изменённого ресурса # Назначение поля
