type: object # Корневой тип схемы стикера
description: Данные стикера на доске # Назначение схемы ответа
additionalProperties: false # Запрещает поля вне properties
required: # Поля, обязательные в объекте стикера
- id # Идентификатор стикера
- boardId # Идентификатор доски
- content # Текст стикера
- position # Позиция стикера
- createdBy # Автор стикера
- createdAt # Время создания
- updatedAt # Время последнего изменения
properties: # Описание полей стикера
  id: # Идентификатор стикера
    type: string # Строковый идентификатор
    description: Идентификатор стикера # Назначение поля
  boardId: # Идентификатор доски
    type: string # Строковый идентификатор
    description: Идентификатор доски # Назначение поля
  content: # Текст стикера
    type: string # Текстовое значение
    description: Текст стикера # Назначение поля
    minLength: 1 # Пустой текст запрещён
    maxLength: 2000 # Максимальная длина текста
  position: # Фактические координаты стикера
    description: Фактическая позиция стикера на доске # Назначение поля
    $ref: ./position.yaml # Ссылка на файл schemas/openapi/position.yaml с координатами
  color: # Необязательный цвет стикера
    type: string # Цвет задаётся строкой
    description: Явно заданный цвет стикера # Назначение поля
    enum: # Допустимые значения цвета
    - yellow # Жёлтый
    - green # Зелёный
    - blue # Синий
    - pink # Розовый
  width: # Необязательная ширина стикера
    type: integer # Ширина задаётся целым числом
    description: Явно заданная ширина в пикселях # Назначение поля
    minimum: 120 # Минимальная ширина
    maximum: 600 # Максимальная ширина
  createdBy: # Автор стикера
    type: string # Идентификатор автора строкой
    description: Идентификатор автора # Назначение поля
  createdAt: # Время создания
    type: string # Дата и время передаются строкой
    format: date-time # Строка должна соответствовать date-time
    description: Дата и время создания # Назначение поля
  updatedAt: # Время последнего изменения
    type: string # Дата и время передаются строкой
    format: date-time # Строка должна соответствовать date-time
    description: Дата и время последнего изменения # Назначение поля
