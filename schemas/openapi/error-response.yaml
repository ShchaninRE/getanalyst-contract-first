type: object # Корневой тип стандартной ошибки
description: Стандартный ответ с ошибкой # Назначение схемы
additionalProperties: false # Запрещает дополнительные поля
required: # Обязательные поля ошибки
- code # Бизнес-код ошибки
- message # Текст ошибки
- traceId # Идентификатор для трассировки
properties: # Поля ответа с ошибкой
  code: # Машиночитаемый код ошибки
    type: string # Код передаётся строкой
    description: Код ошибки # Назначение поля
  message: # Человекочитаемый текст ошибки
    type: string # Сообщение передаётся строкой
    description: Описание ошибки # Назначение поля
  traceId: # Идентификатор запроса
    type: string # Идентификатор передаётся строкой
    description: Идентификатор запроса для трассировки # Назначение поля
